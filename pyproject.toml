[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cashtokens-psbt-lab"
version = "0.1.0"
description = "Deterministic CashTokens PSBT test-vector laboratory for SeedCash / SeedSigner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ecdsa>=0.17",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctlab = "ctlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ctlab*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "../src"]
