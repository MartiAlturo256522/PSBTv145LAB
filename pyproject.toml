[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PSBTv145-LAB"
version = "0.1.0"
description = "Desktop laboratory for Bitcoin Cash PSBT v145 and CashTokens"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ecdsa>=0.17",
  "PySide6>=6.6",
  "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
psbtv145-lab = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "application*", "helpers*", "ui*"]

[tool.setuptools.package-data]
"helpers.ur2" = ["LICENSE"]
"core.receiver" = ["LICENSE", "SOURCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
